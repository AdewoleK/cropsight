name: cropsight
description: "CropSight — offline crop-disease diagnosis powered by on-device Gemma3n. No internet, no cloud; needs an Android phone with ~6-8GB+ RAM."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # On-device LLM inference (Gemma3n multimodal, embeddings, SQLite vector store).
  flutter_gemma: ^1.5.1
  # On-device text embeddings for RAG (Gecko / EmbeddingGemma).
  flutter_gemma_embeddings: ^1.0.4
  # MediaPipe (.task) inference engine backing the Gemma3n E2B model.
  flutter_gemma_mediapipe: ^1.0.4

  # Camera + gallery capture of the leaf photo.
  image_picker: ^1.1.2

  # Lightweight state management for the diagnosis flow.
  provider: ^6.1.2

  # Filesystem paths for the bundled/downloaded model.
  path_provider: ^2.1.4

  # Phase 4: connectivity detection for opportunistic sync.
  connectivity_plus: ^7.3.1
  # Phase 4: posting anonymised results to a sync endpoint.
  http: ^1.6.0

  # Pure-Dart decoding for the pre-diagnosis photo quality check.
  image: ^4.12.0
  # Persisted settings (theme, answer language, read-aloud).
  shared_preferences: ^2.5.6
  # Reads diagnoses aloud with the phone's own (offline) voices.
  flutter_tts: ^4.2.5
  # Offline field reminders — scheduled locally, no push server.
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  # Reads total RAM so low-memory phones get Lite mode instead of a crash.
  device_info_plus: ^13.3.0
  # Hands a diagnosis to WhatsApp/SMS for an extension officer.
  share_plus: ^13.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # Phase 3: bundled RAG knowledge base (crop-disease reference cards).
    - assets/knowledge/

  # Bundled locally (not fetched via the google_fonts package) so the app
  # never needs a network call for type, matching its offline-first pitch.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic
    - family: Allerta Stencil
      fonts:
        - asset: assets/fonts/AllertaStencil-Regular.ttf
